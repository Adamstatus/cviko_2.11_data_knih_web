<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <title>JavaScript</title>
    <script src="app.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="javascript-text">
        <h1>JavaScript</h1>
        <p>Ukážka interaktívnych funkcií na mojej stránke</p>
    </div>

    <div class="javascript-box">
        <h2 id="mojText">Vitaj vo svete Fast &amp; Furious!</h2>
        <button id="zmenText">Zmeniť text</button>
    </div>

    <div class="javascript-box">
        <h2>Počítadlo kliknutí</h2>
        <p id="pocetKliknuti">0</p>

        <button id="pridajKlik">Klikni na mňa</button>
        <button id="resetKlik">Resetovať</button>
    </div>
</body>
</html>
